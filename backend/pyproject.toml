[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seasonality-checker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8,<3",
    "inflect",
    "python-dotenv",
    "psycopg2-binary",
    "recipe-scrapers",
    "requests",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest"]
# Only for the one-off scripts that build and load the postcode -> climate data:
#   pip install --group data
data = ["numpy", "pandas", "geopandas", "rasterio", "xarray", "netCDF4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not llm'"
markers = ["llm: calls the Claude API (costs tokens); run with `pytest -m llm`"]
