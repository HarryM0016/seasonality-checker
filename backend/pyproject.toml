[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seasonality-checker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8,<3",
    "python-dotenv",
    "psycopg2-binary",
    "recipe-scrapers",
    "requests",
    "numpy",
    "pandas",
    "geopandas",
    "rasterio",
    "xarray",
    "netCDF4",
]

[tool.setuptools.packages.find]
where = ["src"]
